<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购物车同步</title>
  <style>
    /* 项目CSS变量 - 与主项目一致 */
    :root {
      --radius: 0.625rem;
      --background: oklch(0.97 0 0);
      --foreground: oklch(0.129 0.042 264.695);
      --card: oklch(1 0 0);
      --card-foreground: oklch(0.129 0.042 264.695);
      --primary: oklch(0.208 0.042 265.755);
      --primary-foreground: oklch(0.984 0.003 247.858);
      --secondary: oklch(0.968 0.007 247.896);
      --secondary-foreground: oklch(0.208 0.042 265.755);
      --muted: oklch(0.945 0.015 264.531);
      --muted-foreground: oklch(0.554 0.046 257.417);
      --accent: oklch(0.968 0.007 247.896);
      --accent-foreground: oklch(0.208 0.042 265.755);
      --destructive: oklch(0.577 0.245 27.325);
      --destructive-foreground: oklch(0.984 0.003 247.858);
      --border: oklch(0.922 0.016 264.531);
      --ring: oklch(0.704 0.04 256.788);
      --input: oklch(0.922 0.016 264.531);
    }

    /* 深色模式 */
    @media (prefers-color-scheme: dark) {
      :root {
        --background: oklch(0.15 0.015 285.823);
        --foreground: oklch(0.92 0 0);
        --card: oklch(0.22 0.015 285.823);
        --card-foreground: oklch(0.92 0 0);
        --primary: oklch(0.92 0 0);
        --primary-foreground: oklch(0.208 0.042 265.755);
        --secondary: oklch(0.24 0.015 285.823);
        --secondary-foreground: oklch(0.92 0 0);
        --muted: oklch(0.22 0.015 285.823);
        --muted-foreground: oklch(0.65 0.015 285.823);
        --accent: oklch(0.24 0.015 285.823);
        --accent-foreground: oklch(0.92 0 0);
        --destructive: oklch(0.7022 0.1892 22.23);
        --destructive-foreground: oklch(0.92 0 0);
        --border: oklch(0.3 0.015 285.823);
        --ring: oklch(0.92 0 0);
        --input: oklch(0.3 0.015 285.823);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    button, input, optgroup, select, textarea {
      font-family: inherit;
    }

    body {
      width: 380px;
      min-height: 280px;
      font-family: -apple-system, BlinkMacSystemFont, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      background: var(--background);
      color: var(--foreground);
      line-height: 1.5;
    }

    /* 卡片样式 */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .card-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
    }

    .card-description {
      font-size: 14px;
      color: var(--muted-foreground);
      margin-top: 4px;
    }

    .card-content {
      padding: 16px;
    }

    .card-footer {
      padding: 0px 16px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 按钮样式 - 与项目 Button 组件完全一致 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      height: 40px;
      padding: 0 16px;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, box-shadow 0.15s, border-color 0.15s;
      border: 1px solid transparent;
      outline: none;
      box-shadow: 0 1px 0 0 rgba(0, 0, 0, 0.05);
    }

    .btn:focus-visible {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .btn:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    /* Primary 按钮 - 与 variant="default" 一致 */
    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: transparent;
      box-shadow: 0 1px 0 0 rgba(0, 0, 0, 0.05);
    }

    .btn-primary:hover {
      background: color-mix(in srgb, var(--primary) 85%, transparent);
    }

    @media (prefers-color-scheme: dark) {
      .btn-primary {
        border-color: 2px solid var(--primary);
      }
      .btn-primary:hover {
        background: color-mix(in srgb, var(--primary) 85%, transparent);
      }
    }

    /* Modern 按钮 - 与 variant="modern" 一致 */
    .btn-modern {
      background: var(--card);
      color: var(--foreground);
      border: 1px solid var(--border);
      box-shadow: 0 1px 0 0 rgba(0, 0, 0, 0.05);
    }

    .btn-modern:hover {
      background: var(--accent);
      color: var(--accent-foreground);
    }

    @media (prefers-color-scheme: dark) {
      .btn-modern {
        background: color-mix(in srgb, var(--input) 30%, transparent);
        border-color: var(--input);
      }
      .btn-modern:hover {
        background: var(--input);
      }
    }

    /* Danger 按钮 - 与 variant="destructive" 一致 */
    .btn-danger {
      background: var(--destructive);
      color: var(--destructive-foreground);
      box-shadow: 0 1px 0 0 rgba(0, 0, 0, 0.05);
    }

    .btn-danger:hover {
      background: color-mix(in srgb, var(--destructive) 90%, transparent);
    }

    @media (prefers-color-scheme: dark) {
      .btn-danger {
        background: color-mix(in srgb, var(--destructive) 70%, transparent);
      }
      .btn-danger:hover {
        background: color-mix(in srgb, var(--destructive) 80%, transparent);
      }
    }

    .btn-sm {
      height: 40px;
      padding: 0 20px;
      font-size: 14px;
    }

    .btn-block {
      width: 100%;
    }

    .btn-row {
      display: flex;
      width: 100%;
      gap: 8px;
    }

    /* 图标按钮 */
    .btn-icon {
      height: 40px;
      width: 40px;
      padding: 0;
      flex-shrink: 0;
    }

    .btn-flex {
      flex: 1;
    }

    /* 输入框 - 匹配项目 Input 组件样式 */
    .input, .select {
      display: flex;
      height: 40px;
      width: 100%;
      padding: 0 12px;
      font-size: 14px;
      line-height: 40px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--foreground);
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      box-sizing: border-box;
    }

    .input::placeholder {
      color: var(--muted-foreground);
    }

    .input:focus, .select:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 2px var(--ring), 0 0 0 4px rgba(0, 0, 0, 0.05);
    }

    .input:disabled, .select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .form-hint {
      display: block;
      font-size: 12px;
      color: var(--muted-foreground);
      margin-top: 4px;
    }

    /* 状态标签 */
    .badge {
      display: inline-flex;
      align-items: center;
      height: 32px;
      padding: 0 10px;
      font-size: 14px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .badge-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .badge-warning { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .badge-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .badge-info { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
    .badge-secondary { background: #e0e7ff; color: #3730a3; border: 1px solid #a5b4fc; }

    @media (prefers-color-scheme: dark) {
      .badge-success { background: #14532d; color: #bbf7d0; border-color: #15803d; }
      .badge-warning { background: #78350f; color: #fde68a; border-color: #b45309; }
      .badge-error { background: #7f1d1d; color: #fecaca; border-color: #b91c1c; }
      .badge-info { background: #1e3a8a; color: #bfdbfe; border-color: #1d4ed8; }
      .badge-secondary { background: #312e81; color: #c7d2fe; border-color: #6366f1; }
    }

    /* 表单组 */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--foreground);
      margin-bottom: 8px;
    }

    /* 复选框 - Native looking styling */
    .checkbox-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .checkbox {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    /* 加载动画 */
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 消息提示 - Alert style */
    .message {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      margin-top: 16px;
      display: none;
      border: 1px solid transparent;
      line-height: 1.4;
    }

    .message.show { display: block; }

    .message-success { background: #ecfdf5; border-color: #34d399; color: #065f46; }
    .message-error { background: #fef2f2; border-color: #f87171; color: #991b1b; }
    .message-info { background: #eff6ff; border-color: #60a5fa; color: #1e40af; }

    @media (prefers-color-scheme: dark) {
      .message-success { background: #064e3b; border-color: #059669; color: #ecfdf5; }
      .message-error { background: #7f1d1d; border-color: #dc2626; color: #fee2e2; }
      .message-info { background: #1e3a8a; border-color: #2563eb; color: #eff6ff; }
    }

    /* 商品卡片 - shadcn styling (匹配 dashboard tab) */
    .item-card {
      background: var(--card);
      color: var(--card-foreground);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); /* shadow-sm */
      padding: 14px;
      margin-bottom: 10px;
      transition: all 0.15s ease;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }

    .item-card.selected {
      background: color-mix(in srgb, var(--accent) 50%, transparent);
    }

    .item-card:hover, .item-card.selected:hover {
      background: var(--accent);
      color: var(--accent-foreground);
    }

    @media (prefers-color-scheme: dark) {
      .item-card.selected {
        border-color: var(--primary);
      }
    }

    .item-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 6px;
    }

    .item-name {
      flex: 1;
      font-weight: 500;
      font-size: 14px;
      line-height: 1.4;
      color: var(--foreground);
    }
    
    .item-name a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    
    .item-name a:hover {
      color: var(--primary);
    }

    .item-body {
      padding-left: 28px; /* alignment with name next to checkbox */
      font-size: 14px;
      color: var(--muted-foreground);
    }

    .item-row {
      display: flex;
      margin-bottom: 4px;
    }

    .item-label {
      width: 50px;
      flex-shrink: 0;
    }

    .item-value {
      flex: 1;
    }

    /* 商品列表容器 */
    .item-list {
      max-height: 280px;
      overflow-y: auto;
      margin-top: 16px;
      scrollbar-gutter: stable;
    }

    .item-list::-webkit-scrollbar {
      width: 6px;
    }
    .item-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .item-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    .item-list::-webkit-scrollbar-thumb:hover {
      background: var(--muted-foreground);
    }

    /* 底部说明 */
    .footer {
      padding: 12px 16px;
      text-align: center;
      font-size: 14px;
      color: var(--muted-foreground);
      border-top: 1px solid var(--border);
      background: var(--background);
    }

    /* 工具类 */
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .mb-3 { margin-bottom: 12px; }
    .mt-3 { margin-top: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- 主界面 -->
  <div id="mainSection">
    <div class="card">
      <div class="card-header">
        <div class="card-title">购物车同步</div>
        <div class="card-description">北大医学部试剂平台 → 实验室管理系统</div>
      </div>
      <div class="card-content">
        <div class="form-group">
          <div class="form-label">目标网站状态</div>
          <div id="targetStatus" class="badge badge-warning">检测中...</div>
        </div>

        <div class="btn-row">
          <button class="btn btn-modern btn-icon" id="configBtn" title="配置">⚙️</button>
          <button class="btn btn-primary btn-flex" id="fetchBtn">获取购物车</button>
        </div>

        <div class="message" id="result"></div>
      </div>
    </div>
  </div>

  <!-- 配置界面 -->
  <div id="configSection" class="hidden">
    <div class="card">
      <div class="card-header">
        <div class="card-title">插件配置</div>
        <div class="card-description">配置系统 URL 以适配不同环境</div>
      </div>
      <div class="card-content">
        <div class="form-group">
          <label class="form-label" for="systemUrl">系统地址</label>
          <input
            type="text"
            id="systemUrl"
            class="input"
            placeholder="http://localhost:5173"
          >
          <small class="form-hint">开发环境默认 http://localhost:5173，生产环境填写公网域名</small>
        </div>

        <div class="form-group">
          <label class="form-label" for="reagentSiteUrl">试剂平台地址</label>
          <input
            type="text"
            id="reagentSiteUrl"
            class="input"
            placeholder="https://reagent.bjmu.edu.cn"
          >
        </div>

        <div class="form-group">
          <label class="form-label">检测到的网站主题</label>
          <div id="siteThemeStatus" class="badge badge-info">检测中...</div>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-modern btn-sm" id="configBackBtn">返回</button>
        <button class="btn btn-primary btn-sm" id="configSaveBtn">保存配置</button>
      </div>
    </div>
  </div>

  <!-- 预览界面 -->
  <div id="previewSection" class="hidden">
    <div class="card">
      <div class="card-header">
        <div class="card-title">商品预览</div>
        <div class="card-description" id="previewCount">0/0</div>
      </div>
      <div class="card-content">
        <div class="checkbox-wrapper mb-3">
          <input type="checkbox" id="selectAll" class="checkbox" checked>
          <label for="selectAll">全选</label>
        </div>
        <div class="item-list" id="itemList"></div>
      </div>
      <div class="card-footer">
        <button class="btn btn-modern btn-sm" id="backBtn">返回</button>
        <button class="btn btn-primary btn-sm" id="importBtn">开始导入</button>
      </div>
    </div>
  </div>

  <div class="footer">
    提示：请确保试剂管理平台购物车页面已打开
  </div>

  <script src="popup.js"></script>
</body>
</html>
