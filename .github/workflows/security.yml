name: Security

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python audit tools
        run: python -m pip install poetry poetry-plugin-export pip-audit

      - name: Export locked Python dependencies
        run: poetry export --format requirements.txt --without-hashes --only main --output /tmp/requirements.txt

      - name: Check locked Python dependencies for vulnerabilities
        run: |
          poetry check --lock
          python -m pip_audit --no-deps --disable-pip --requirement /tmp/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"

      - name: Install npm 11.8.0
        run: npm install --global npm@11.8.0

      - name: Check npm dependencies for vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high
