<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购物车同步</title>
  <style>
    /* 项目CSS变量 - 与主项目一致 */
    :root {
      --radius: 0.625rem;
      --background: oklch(0.97 0 0);
      --foreground: oklch(0.129 0.042 264.695);
      --card: oklch(1 0 0);
      --card-foreground: oklch(0.129 0.042 264.695);
      --primary: oklch(0.208 0.042 265.755);
      --primary-foreground: oklch(0.984 0.003 247.858);
      --secondary: oklch(0.968 0.007 247.896);
      --secondary-foreground: oklch(0.208 0.042 265.755);
      --muted: oklch(0.945 0.015 264.531);
      --muted-foreground: oklch(0.554 0.046 257.417);
      --accent: oklch(0.968 0.007 247.896);
      --accent-foreground: oklch(0.208 0.042 265.755);
      --destructive: oklch(0.577 0.245 27.325);
      --destructive-foreground: oklch(0.984 0.003 247.858);
      --border: oklch(0.922 0.016 264.531);
      --ring: oklch(0.704 0.04 256.788);
      --input: oklch(0.922 0.016 264.531);
    }

    /* 深色模式 */
    @media (prefers-color-scheme: dark) {
      :root {
        --background: oklch(0.15 0.015 285.823);
        --foreground: oklch(0.92 0 0);
        --card: oklch(0.22 0.015 285.823);
        --card-foreground: oklch(0.92 0 0);
        --primary: oklch(0.92 0 0);
        --primary-foreground: oklch(0.208 0.042 265.755);
        --secondary: oklch(0.24 0.015 285.823);
        --secondary-foreground: oklch(0.92 0 0);
        --muted: oklch(0.22 0.015 285.823);
        --muted-foreground: oklch(0.65 0.015 285.823);
        --accent: oklch(0.24 0.015 285.823);
        --accent-foreground: oklch(0.92 0 0);
        --destructive: oklch(0.7022 0.1892 22.23);
        --destructive-foreground: oklch(0.92 0 0);
        --border: oklch(0.3 0.015 285.823);
        --ring: oklch(0.92 0 0);
        --input: oklch(0.3 0.015 285.823);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 280px;
      font-family: 'SourceHanSansSC', 'SourceHanSansSC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      background: var(--background);
      color: var(--foreground);
      line-height: 1.5;
    }

    /* 卡片样式 */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .card-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
    }

    .card-description {
      font-size: 13px;
      color: var(--muted-foreground);
      margin-top: 4px;
    }

    .card-content {
      padding: 16px;
    }

    .card-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 按钮样式 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      height: 36px;
      padding: 0 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      outline: none;
    }

    .btn:focus-visible {
      box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring);
    }

    .btn:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--secondary);
      color: var(--secondary-foreground);
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .btn-secondary:hover {
      opacity: 0.9;
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--foreground);
    }

    .btn-outline:hover {
      background: var(--accent);
      color: var(--accent-foreground);
    }

    .btn-success {
      background: #22c55e;
      color: white;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .btn-success:hover {
      background: #16a34a;
    }

    .btn-danger {
      background: var(--destructive);
      color: var(--destructive-foreground);
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    .btn-sm {
      height: 32px;
      padding: 0 12px;
      font-size: 13px;
    }

    .btn-block {
      width: 100%;
    }

    /* 输入框 */
    .input, .select {
      height: 36px;
      padding: 0 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--background);
      color: var(--foreground);
      outline: none;
    }

    .input:focus, .select:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
    }

    /* 状态标签 */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 9999px;
    }

    .badge-success {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }

    @media (prefers-color-scheme: dark) {
      .badge-success {
        background: rgba(34, 197, 94, 0.2);
        color: #4ade80;
        border-color: rgba(34, 197, 94, 0.3);
      }
    }

    .badge-warning {
      background: #fefce8;
      color: #ca8a04;
      border: 1px solid #fef08a;
    }

    @media (prefers-color-scheme: dark) {
      .badge-warning {
        background: rgba(234, 179, 8, 0.2);
        color: #facc15;
        border-color: rgba(234, 179, 8, 0.3);
      }
    }

    .badge-error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    @media (prefers-color-scheme: dark) {
      .badge-error {
        background: rgba(239, 68, 68, 0.2);
        color: #f87171;
        border-color: rgba(239, 68, 68, 0.3);
      }
    }

    .badge-info {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
    }

    @media (prefers-color-scheme: dark) {
      .badge-info {
        background: rgba(59, 130, 246, 0.2);
        color: #93c5fd;
        border-color: rgba(59, 130, 246, 0.3);
      }
    }

    /* 表单组 */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--foreground);
      margin-bottom: 6px;
    }

    /* 复选框 */
    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    /* 加载动画 */
    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 消息提示 */
    .message {
      padding: 12px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    .message.show { display: block; }
    .message-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a; }
    .message-error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
    .message-info { background: #eff6ff; border: 1px solid #bfdbfe; color: #2563eb; }

    @media (prefers-color-scheme: dark) {
      .message-success {
        background: rgba(34, 197, 94, 0.15);
        border-color: rgba(34, 197, 94, 0.3);
        color: #4ade80;
      }
      .message-error {
        background: rgba(239, 68, 68, 0.15);
        border-color: rgba(239, 68, 68, 0.3);
        color: #f87171;
      }
      .message-info {
        background: rgba(59, 130, 246, 0.15);
        border-color: rgba(59, 130, 246, 0.3);
        color: #93c5fd;
      }
    }

    /* 商品卡片 */
    .item-card {
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 8px;
      transition: border-color 0.15s ease;
    }

    .item-card.selected {
      border-color: var(--primary);
      background: var(--accent);
    }

    .item-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .item-name {
      flex: 1;
      font-weight: 500;
      font-size: 14px;
      line-height: 1.4;
    }

    .item-body {
      font-size: 12px;
      color: var(--muted-foreground);
    }

    .item-row {
      display: flex;
      margin-bottom: 4px;
    }

    .item-label {
      width: 50px;
      flex-shrink: 0;
    }

    .item-value {
      flex: 1;
    }

    /* 商品列表容器 */
    .item-list {
      max-height: 240px;
      overflow-y: auto;
      margin-top: 12px;
    }

    /* 底部说明 */
    .footer {
      padding: 12px 16px;
      text-align: center;
      font-size: 12px;
      color: var(--muted-foreground);
      border-top: 1px solid var(--border);
      background: var(--background);
    }

    /* 工具类 */
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .mb-3 { margin-bottom: 12px; }
    .mt-3 { margin-top: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- 主界面 -->
  <div id="mainSection">
    <div class="card">
      <div class="card-header">
        <div class="card-title">购物车同步</div>
        <div class="card-description">北大医学部试剂平台 → 实验室管理系统</div>
      </div>
      <div class="card-content">
        <div class="form-group">
          <label class="form-label">目标网站状态</label>
          <div id="targetStatus" class="badge badge-warning">检测中...</div>
        </div>

        <div class="form-group">
          <label class="form-label">订单类型</label>
          <select id="orderType" class="select" style="width: 100%;">
            <option value="consumable">耗材订单</option>
            <option value="reagent">试剂订单</option>
          </select>
        </div>

        <button class="btn btn-primary btn-block" id="fetchBtn">获取购物车</button>

        <div class="message" id="result"></div>
      </div>
    </div>
  </div>

  <!-- 预览界面 -->
  <div id="previewSection" class="hidden">
    <div class="card">
      <div class="card-header">
        <div class="card-title">商品预览</div>
        <div class="card-description" id="previewCount">0/0</div>
      </div>
      <div class="card-content">
        <div class="checkbox-wrapper mb-3">
          <input type="checkbox" id="selectAll" class="checkbox" checked>
          <label for="selectAll">全选</label>
        </div>
        <div class="item-list" id="itemList"></div>
      </div>
      <div class="card-footer">
        <button class="btn btn-outline btn-sm" id="backBtn">返回</button>
        <button class="btn btn-success btn-sm" id="importBtn">导入选中</button>
      </div>
    </div>
  </div>

  <div class="footer">
    请确保购物车页面已打开并登录
  </div>

  <script src="popup.js"></script>
</body>
</html>
