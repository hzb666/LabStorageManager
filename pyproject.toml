[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "lab-storage-manager"
version = "0.7.1"
description = "Laboratory Inventory Management System (LIMS)"
authors = ["Lab Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework
fastapi = "^0.139.2"
uvicorn = {extras = ["standard"], version = "^0.42.0"}
python-multipart = "^0.0.32"

# Database
sqlmodel = "^0.0.37"
pysqlite3-binary = {version = "^0.5.4", markers = "sys_platform != 'win32'"}

# Auth
pyjwt = {version = "^2.13.0", extras = ["crypto"]}
bcrypt = "^5.0.0"

# Utilities
python-dotenv = "^1.2.2"
pillow = "^12.3.0"
pandas = "^3.0.1"
pydantic = "^2.12.5"
pydantic-settings = "^2.14.2"
pypinyin = "^0.55.0"
requests = "^2.34.2"
urllib3 = "^2.7.0"
redis = "^7.4.0"
mcp = {extras = ["cli"], version = "^1.28.1"}
rdkit = "^2026.3.1"
httpx = "^0.28.1"
sentry-sdk = {extras = ["fastapi"], version = "^2.63.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"


[tool.poetry.group.scripts.dependencies]
openpyxl = "^3.1.5"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15
